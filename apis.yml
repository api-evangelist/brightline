aid: brightline
name: Brightline
description: 'Brightline is an award-winning pediatric mental health practice delivering therapy,
  psychiatry (including medication management), and psychological testing for children and adolescents
  up to age 18, using an evidence-based, family-focused model that begins with a structured diagnostic
  evaluation. It treats anxiety, OCD, ADHD, disruptive behavioral disorders, depression, trauma, grief,
  and autism-spectrum symptoms via in-person clinics in New York and telehealth across NY, NJ, CT, MA,
  and WA, and operates BrightLife Kids, a free California state-funded behavioral health program for
  families with children up to age 12. Surfaced as a portfolio company of GV and Threshold Ventures;
  Brightline is a consumer/clinical healthcare provider with no public developer API surface at this time.'
